# Cosmic Crusade relay: deploy with  npx wrangler deploy  (see docs/players/HOST-YOUR-OWN-SERVER.md)
name = "cosmic-crusade-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The free plan only allows SQLite-backed Durable Objects, hence new_sqlite_classes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
